
name: Build MeTube APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/
          cp style.css www/
          cp app.js www/
          cp -r data www/

      - name: Build Keep Awake bridge
        run: |
          npx esbuild keep-awake-entry.js \
            --bundle \
            --format=iife \
            --outfile=www/keep-awake.js

          python3 - <<'PY'
          from pathlib import Path

          path = Path("www/index.html")
          html = path.read_text()

          if 'src="keep-awake.js"' not in html:
              if "</body>" not in html:
                  raise SystemExit("Could not find </body> in index.html")

              html = html.replace(
                  "</body>",
                  '    <script src="keep-awake.js"></script>\n</body>'
              )
              path.write_text(html)
          PY

      - name: Add Android platform
        run: npx cap add android

      - name: Test background WebView playback
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "node_modules/@capacitor/android/capacitor/src/main/java/"
              "com/getcapacitor/BridgeActivity.java"
          )

          if not path.exists():
              raise SystemExit(
                  "BridgeActivity.java not found; Android source layout changed."
              )

          source = path.read_text()

          old = """    @Override
              public void onPause() {
                  super.onPause();
                  if (bridge != null) {
                      this.bridge.onPause();
                      Logger.debug("App paused");
                  }
              }"""

          new = """    @Override
              public void onPause() {
                  super.onPause();

                  if (bridge != null) {
                      android.os.PowerManager powerManager =
                          (android.os.PowerManager) getSystemService(POWER_SERVICE);

                      android.app.KeyguardManager keyguardManager =
                          (android.app.KeyguardManager) getSystemService(KEYGUARD_SERVICE);

                      boolean screenInteractive =
                          powerManager != null && powerManager.isInteractive();

                      boolean keyguardLocked =
                          keyguardManager != null && keyguardManager.isKeyguardLocked();

                      if (!screenInteractive || keyguardLocked) {
                          this.bridge.onPause();
                          Logger.debug("App paused: screen off or locked");
                      } else {
                          Logger.debug("App pause skipped: background playback test");
                      }
                  }
              }"""

          if old not in source:
              raise SystemExit(
                  "Could not safely patch BridgeActivity.onPause(); "
                  "source differs from the expected version."
              )

          path.write_text(source.replace(old, new, 1))
          print("Background playback experiment applied.")
          PY

      - name: Generate app icons
        run: npx @capacitor/assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeTube-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
